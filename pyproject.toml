[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicdlp"
version = "2.0.0"
description = "Desktop audio downloader with Spotify Local Files delivery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "For personal use" }
dependencies = [
    "PySide6>=6.7",
    "yt-dlp>=2025.1.1",
    "mutagen>=1.47.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.6"]

[project.gui-scripts]
musicdlp = "musicdlp.app:main"

[tool.setuptools.packages.find]
include = ["musicdlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
